<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>发射工位 07 · 可交互 3D</title>
<style>
  :root {
    --ink: #e8eef6; --dim: #93a4b8; --line: rgba(160,190,225,.20);
    --accent: #ff8a3d; --accent2: #59c2ff; --panel: rgba(9,14,22,.72);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070b; color: var(--ink);
    font-family: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  #app { position: fixed; inset: 0; }
  #scrim { position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: linear-gradient(180deg, rgba(4,7,12,.38) 0%, rgba(4,7,12,.12) 14%, rgba(4,7,12,0) 28%),
                linear-gradient(0deg, rgba(4,7,12,.42) 0%, rgba(4,7,12,.10) 11%, rgba(4,7,12,0) 24%);
    transition: opacity .4s; }
  canvas { display: block; }

  .hud { position: fixed; pointer-events: none; z-index: 3; }
  .tl { top: 22px; left: 24px; }
  .tr { top: 22px; right: 24px; text-align: right; }
  .bl { bottom: 22px; left: 24px; }
  .br { bottom: 22px; right: 24px; text-align: right; }

  .brand { font-size: 12px; letter-spacing: .34em; color: var(--accent); text-transform: uppercase; }
  .title { font-size: 30px; font-weight: 700; letter-spacing: .04em; margin-top: 6px;
    text-shadow: 0 2px 18px rgba(0,0,0,.85), 0 0 42px rgba(0,0,0,.55); }
  .sub { font-size: 12.5px; color: #b9c9dc; margin-top: 6px; letter-spacing: .06em;
    text-shadow: 0 1px 10px rgba(0,0,0,.9); }
  .brand { text-shadow: 0 1px 12px rgba(0,0,0,.8); }
  .stat .k { text-shadow: 0 1px 8px rgba(0,0,0,.85); }
  .stat .v { text-shadow: 0 2px 14px rgba(0,0,0,.7); }

  .stat { font-variant-numeric: tabular-nums; }
  .stat .k { font-size: 10.5px; letter-spacing: .22em; color: var(--dim); }
  .stat .v { font-size: 26px; font-weight: 600; letter-spacing: .02em; }
  .stat .u { font-size: 12px; color: var(--dim); margin-left: 3px; }

  .clock { font-size: 46px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .02em;
    color: var(--accent2); text-shadow: 0 0 26px rgba(89,194,255,.45); }

  #panel { position: fixed; left: 24px; bottom: 104px; z-index: 3; width: 258px; pointer-events: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 15px; backdrop-filter: blur(14px); box-shadow: 0 18px 50px rgba(0,0,0,.5); }
  #panel h4 { margin: 0 0 10px; font-size: 11px; letter-spacing: .26em; color: var(--dim); font-weight: 600; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 7px 0; }
  .row label { font-size: 12.5px; color: #c8d4e4; }
  .row input[type=range] { width: 118px; accent-color: var(--accent); }
  .chk { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #c8d4e4; cursor: pointer; }
  .chk input { accent-color: var(--accent); width: 15px; height: 15px; }

  #bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px; z-index: 4; display: flex; gap: 10px;
    pointer-events: auto; }
  button { font: inherit; font-size: 13px; color: #dfe8f4; background: rgba(16,24,36,.86);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; cursor: pointer;
    transition: .18s; backdrop-filter: blur(10px); letter-spacing: .04em; }
  button:hover { border-color: rgba(255,138,61,.7); color: #fff; transform: translateY(-1px); }
  button.primary { background: linear-gradient(135deg,#ff7a2f,#ff9d4d); border-color: transparent; color: #1a0d04; font-weight: 700; }
  button.primary:hover { filter: brightness(1.08); }
  button.on { border-color: var(--accent2); color: var(--accent2); }
  button:disabled { opacity: .42; cursor: default; transform: none; }

  .legend { position: fixed; right: 24px; bottom: 104px; z-index: 3; width: 210px; pointer-events: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
    backdrop-filter: blur(14px); font-size: 12px; color: #b9c7d8; }
  .legend .h { font-size: 10.5px; letter-spacing: .24em; color: var(--dim); margin-bottom: 9px; }
  .legend .i { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
  .legend .d { width: 8px; height: 8px; border-radius: 2px; flex: none; }

  #load { position: fixed; inset: 0; background: #05070b; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; z-index: 50; transition: opacity .7s; }
  #load .lbar { width: 220px; height: 2px; background: rgba(255,255,255,.1); overflow: hidden; border-radius: 2px; }
  #load .lbar i { display: block; height: 100%; width: 12%; background: var(--accent); transition: width .3s; }
  #load .lt { font-size: 11px; letter-spacing: .3em; color: var(--dim); }
  .hidden { opacity: 0; pointer-events: none; }

  #tip { position: fixed; pointer-events: none; padding: 6px 10px; border-radius: 8px; font-size: 12px;
    background: rgba(8,12,18,.92); border: 1px solid var(--line); color: #dce7f4; opacity: 0;
    transition: opacity .15s; transform: translate(-50%, -150%); white-space: nowrap; }

  .tag { display: inline-block; font-size: 10px; letter-spacing: .18em; padding: 3px 8px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--dim); }
  .tag.live { color: var(--accent); border-color: rgba(255,138,61,.5); }
  @media (max-width: 820px) { #panel, .legend { display: none; } .title { font-size: 21px; } .clock { font-size: 32px; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="scrim"></div>

<div class="hud tl">
  <div class="brand">Launch Complex 07</div>
  <div class="title">发射工位 · 可交互三维沙盘</div>
  <div class="sub">Blender 建模 · three.js 实时 · 拖拽旋转 / 滚轮缩放</div>
</div>

<div class="hud tr">
  <div class="stat"><div class="k">任务时钟 T</div><div class="clock" id="clock">T-00:10</div></div>
  <div class="stat" style="margin-top:8px"><div class="k">状态</div><div class="v" id="phase" style="font-size:15px">待机 STANDBY</div></div>
</div>

<div class="hud bl" style="bottom:104px">
  <div class="stat"><div class="k">高度 ALT</div><div class="v"><span id="alt">0</span><span class="u">m</span></div></div>
</div>

<div id="panel">
  <h4>场景控制</h4>
  <div class="row"><label>昼 / 夜</label><input id="night" type="range" min="0" max="100" value="0"></div>
  <div class="row"><label>排气密度</label><input id="smoke" type="range" min="20" max="180" value="100"></div>
  <div class="row"><label class="chk"><input id="orbit" type="checkbox" checked>自动环绕</label></div>
  <div class="row"><label class="chk"><input id="slow" type="checkbox">慢动作 0.35×</label></div>
  <div class="row"><label class="chk"><input id="hot" type="checkbox" checked>标注热点</label></div>
</div>

<div class="legend">
  <div class="h">STRUCTURES</div>
  <div class="i"><span class="d" style="background:#6f7c8c"></span>发射台 / 导流槽</div>
  <div class="i"><span class="d" style="background:#9aa7b8"></span>勤务塔 92 m</div>
  <div class="i"><span class="d" style="background:#c0392b"></span>摆杆 / 避雷塔</div>
  <div class="i"><span class="d" style="background:#e6e8ea"></span>两级半运载火箭</div>
  <div class="i"><span class="d" style="background:#c9d2da"></span>推进剂球罐 / 水塔</div>
</div>

<div id="bar">
  <button class="primary" id="btnLaunch">点火发射</button>
  <button id="btnReset">复位</button>
  <button id="btnCam">切换视角</button>
  <button id="btnNight">夜间模式</button>
</div>

<div id="tip"></div>
<script>
(function () {
  if (!/debug/.test(location.search)) return;
  var box = document.createElement('div');
  box.style.cssText = 'position:fixed;left:8px;top:8px;right:8px;max-height:46vh;overflow:auto;z-index:999;background:rgba(120,0,0,.9);color:#fff;font:12px/1.5 monospace;padding:10px;border-radius:8px;white-space:pre-wrap';
  document.body.appendChild(box);
  function log(m) { box.textContent += m + '\n'; }
  addEventListener('error', function (e) { log('ERR ' + e.message + ' @' + (e.filename || '') + ':' + e.lineno); });
  addEventListener('unhandledrejection', function (e) { log('REJ ' + (e.reason && e.reason.message || e.reason)); });
  var ce = console.error; console.error = function () { log('CON ' + [].join.call(arguments, ' ')); ce.apply(console, arguments); };
  setTimeout(function () { if (!box.textContent) box.remove(); }, 5000);
})();
</script>
<div id="load"><div class="lt">LOADING LAUNCH COMPLEX</div><div class="lbar"><i id="lbar"></i></div></div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three@0.160.0/build/three.module.js",
    "three/addons/": "./vendor/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="./js/main.js"></script>
</body>
</html>
